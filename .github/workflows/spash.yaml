name: Windows RDP Zrok

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          net user runneradmin "admin@123"

      - name: Download and Install Zrok
        shell: bash
        run: |
          DOWNLOAD_URL="https://github.com/openziti/zrok/releases/download/v2.0.4/zrok_2.0.4_windows_amd64.tar.gz"
          echo "Downloading zrok from $DOWNLOAD_URL"
          curl -L -o zrok.tar.gz "$DOWNLOAD_URL"
          tar -xzf zrok.tar.gz
          echo "Files after extraction:"
          find . -name "*.exe"
          ZROK_EXE=$(find . -name "zrok*.exe" -type f | head -1)
          if [ -z "$ZROK_EXE" ]; then
            echo "Error: No zrok executable found!"
            exit 1
          fi
          echo "Found executable: $ZROK_EXE"
          echo "ZROK_EXE=$(realpath "$ZROK_EXE")" >> $GITHUB_ENV
          # Verify
          "$ZROK_EXE" version

      - name: Enable Zrok Account
        shell: bash
        env:
          ZROK_ENABLE_TOKEN: ${{ secrets.ZROK_ENABLE_TOKEN }}
        run: |
          "$ZROK_EXE" enable "$ZROK_ENABLE_TOKEN"

      - name: Create Zrok TCP Tunnel for RDP
        shell: bash
        run: |
          echo "Reserving public TCP tunnel..."
          reserve_output=$("$ZROK_EXE" reserve public --backend-mode tcpTunnel 127.0.0.1 3389 2>&1)
          echo "$reserve_output"
          share_name=$(echo "$reserve_output" | grep -oP 'reserved share: \K\S+')
          if [ -z "$share_name" ]; then
            echo "Failed to reserve share. Check output above."
            exit 1
          fi
          echo "Share name: $share_name"

          echo "Starting tunnel..."
          "$ZROK_EXE" share reserved "$share_name" > tunnel.log 2>&1 &
          sleep 10

          cat tunnel.log
          tcp_url=$(grep -oP 'tcp://[^ ]+' tunnel.log | head -1)
          if [ -n "$tcp_url" ]; then
            hostName=$(echo "$tcp_url" | sed -E 's#tcp://([^:]+):.*#\1#')
            portNumber=$(echo "$tcp_url" | sed -E 's#tcp://[^:]+:([0-9]+)#\1#')
            echo "========================================="
            echo "RDP Address: $hostName"
            echo "RDP Port: $portNumber"
            echo "RDP User: runneradmin"
            echo "RDP Pass: admin@123"
            echo "========================================="
          else
            echo "Failed to extract public URL. Full log:"
            cat tunnel.log
            exit 1
          fi

          while true; do
            echo "[$(date)] RDP Active via Zrok"
            sleep 300
          done
