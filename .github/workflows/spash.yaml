name: Windows RDP Zrok

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          net user runneradmin "admin@123"

      - name: Download and Install Zrok
        shell: bash
        run: |
          # Get the latest download URL for Windows
          DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/openziti/zrok/releases/latest | \
            grep "browser_download_url.*windows_amd64.tar.gz" | cut -d : -f 2,3 | tr -d \")
          # Trim whitespace
          DOWNLOAD_URL=$(echo $DOWNLOAD_URL)
          echo "Downloading from: $DOWNLOAD_URL"
          # Download the archive
          curl -L -o zrok.tar.gz "$DOWNLOAD_URL"
          tar -xzf zrok.tar.gz
          # Add to PATH
          echo "${{ github.workspace }}" >> $GITHUB_PATH
          # Verify
          ./zrok.exe version

      - name: Enable Zrok Account
        shell: bash
        env:
          ZROK_ENABLE_TOKEN: ${{ secrets.ZROK_ENABLE_TOKEN }}
        run: |
          ./zrok.exe enable "$ZROK_ENABLE_TOKEN"

      - name: Create Zrok TCP Tunnel for RDP
        shell: bash
        run: |
          echo "Reserving public TCP tunnel..."
          # Reserve a public share for TCP tunneling
          reserve_output=$(./zrok.exe reserve public --backend-mode tcpTunnel 127.0.0.1 3389 2>&1)
          echo "$reserve_output"
          # Extract the reserved share name
          share_name=$(echo "$reserve_output" | grep -oP 'reserved share: \K\S+')
          if [ -z "$share_name" ]; then
            echo "Failed to reserve share. Check output above."
            exit 1
          fi
          echo "Share name: $share_name"

          echo "Starting tunnel..."
          # Start the reserved share in the background
          ./zrok.exe share reserved "$share_name" > tunnel.log 2>&1 &
          sleep 10

          # Display connection info
          cat tunnel.log
          # Extract the public TCP URL (e.g., tcp://xxxx.share.zrok.io:12345)
          tcp_url=$(grep -oP 'tcp://[^ ]+' tunnel.log | head -1)
          if [ -n "$tcp_url" ]; then
            hostName=$(echo "$tcp_url" | sed -E 's#tcp://([^:]+):.*#\1#')
            portNumber=$(echo "$tcp_url" | sed -E 's#tcp://[^:]+:([0-9]+)#\1#')
            echo "========================================="
            echo "RDP Address: $hostName"
            echo "RDP Port: $portNumber"
            echo "RDP User: runneradmin"
            echo "RDP Pass: admin@123"
            echo "========================================="
          else
            echo "Failed to extract public URL. Full log:"
            cat tunnel.log
            exit 1
          fi

          # Keep the runner alive
          while true; do
            echo "[$(date)] RDP Active via Zrok"
            sleep 300
          done
          
