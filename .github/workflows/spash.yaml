name: Windows RDP Bore Tunnel

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          net user runneradmin "admin@123"

      - name: Download Bore
        shell: bash
        run: |
          # Download the latest bore release for Windows
          curl -sL https://api.github.com/repos/ekzhang/bore/releases/latest | \
            grep "browser_download_url.*windows-x86_64" | cut -d : -f 2,3 | tr -d \" | wget -qi -
          # Extract
          unzip -o bore*.zip
          ls -la
          echo "BORE_EXE=$(pwd)/bore.exe" >> $GITHUB_ENV

      - name: Start Bore Tunnel
        shell: bash
        run: |
          echo "Starting Bore TCP tunnel for RDP..."
          # bore local <local_port> --to bore.pub --port <remote_port> (use 0 for random)
          "$BORE_EXE" local 3389 --to bore.pub --port 0 > tunnel.log 2>&1 &
          BORE_PID=$!
          sleep 10

          echo "=== Tunnel Log Output ==="
          cat tunnel.log
          echo "=== End of Log ==="

          # Extract the assigned address and port
          # bore output typically looks like:
          # "listening at bore.pub:12345" or "tcp://bore.pub:12345"
          address=$(grep -oP '(?:listening at|tcp://)\s*\K[^ ]+' tunnel.log | head -1)
          if [ -n "$address" ]; then
            # Remove any trailing characters
            hostPort="$address"
            # If it's just a port, prepend bore.pub
            if [[ "$hostPort" =~ ^[0-9]+$ ]]; then
              hostPort="bore.pub:$hostPort"
            fi
            echo "========================================="
            echo "RDP Address: $hostPort"
            echo "RDP User: runneradmin"
            echo "RDP Pass: admin@123"
            echo "========================================="
          else
            echo "Could not auto-detect address. Check your bore.log above or the full log."
            echo "But the tunnel is running. You can find the address in the log."
            # Keep alive
          fi

          # Keep the runner alive
          while true; do
            echo "[$(date)] RDP Active via Bore"
            sleep 300
          done
