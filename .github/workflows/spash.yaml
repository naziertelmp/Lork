name: Windows RDP Serveo Tunnel

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          net user runneradmin "admin@123"

      - name: Start SSH Tunnel (Serveo)
        shell: bash
        run: |
          echo "Starting SSH Tunnel via Serveo..."
          # Request a random public port
          ssh -o StrictHostKeyChecking=no -T -R 0:localhost:3389 serveo.net > tunnel.log 2>&1 &
          SSH_PID=$!
          sleep 15
          
          echo "=== Tunnel Log Output ==="
          cat tunnel.log
          echo "=== End of Log ==="
          
          log_content=$(cat tunnel.log)
          # Serveo outputs: "Forwarding TCP -> serveo.net:PORT" or "Access via: serveo.net:PORT"
          if [[ $log_content =~ serveo\.net:([0-9]+) ]]; then
              portNumber="${BASH_REMATCH[1]}"
              hostName="serveo.net"
              echo "========================================="
              echo "RDP Address: $hostName"
              echo "RDP Port: $portNumber"
              echo "RDP User: runneradmin"
              echo "RDP Pass: admin@123"
              echo "========================================="
          else
              echo "Failed to extract public URL. Full log:"
              cat tunnel.log
              exit 1
          fi
          
          # Keep the runner alive
          while true; do
              echo "[$(date)] RDP Active via Serveo"
              sleep 300
          done
