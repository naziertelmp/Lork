name: Windows RDP LocalhostRun Tunnel

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          net user runneradmin "admin@123"

      - name: Start SSH Tunnel (localhost.run)
        shell: bash
        run: |
          echo "Starting SSH Tunnel via localhost.run..."
          # -R 0:localhost:3389 asks for a random public port
          ssh -o StrictHostKeyChecking=no -T -R 0:localhost:3389 nokey@localhost.run > tunnel.log 2>&1 &
          SSH_PID=$!
          sleep 15
          
          echo "=== Tunnel Log Output ==="
          cat tunnel.log
          echo "=== End of Log ==="
          
          log_content=$(cat tunnel.log)
          
          # localhost.run outputs a line like:
          # "tcp://xxxx.lhr.life:12345" or "Connect to http://xxxx.lhr.life:12345"
          # We'll capture the URL that contains lhr.life
          if [[ $log_content =~ ([a-zA-Z0-9-]+\.lhr\.life):?([0-9]*) ]]; then
              hostName="${BASH_REMATCH[1]}"
              portNumber="${BASH_REMATCH[2]}"
              # If portNumber is empty, try to find it after "port " or after colon later
              if [ -z "$portNumber" ]; then
                  portNumber=$(echo "$log_content" | grep -oP 'port \K[0-9]+' | head -1)
              fi
              echo "========================================="
              echo "RDP Address: $hostName"
              echo "RDP Port: $portNumber"
              echo "RDP User: runneradmin"
              echo "RDP Pass: admin@123"
              echo "========================================="
          else
              echo "Failed to extract public URL. Full log:"
              cat tunnel.log
              exit 1
          fi
          
          # Keep the runner alive
          while true; do
              echo "[$(date)] RDP Active via localhost.run"
              sleep 300
          done
