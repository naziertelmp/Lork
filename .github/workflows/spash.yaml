name: Windows RDP Zrok (Private Share)

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          net user runneradmin "admin@123"

      - name: Download and Install Zrok
        shell: bash
        run: |
          DOWNLOAD_URL="https://github.com/openziti/zrok/releases/download/v2.0.4/zrok_2.0.4_windows_amd64.tar.gz"
          echo "Downloading zrok from $DOWNLOAD_URL"
          curl -L -o zrok.tar.gz "$DOWNLOAD_URL"
          tar -xzf zrok.tar.gz
          echo "Files after extraction:"
          find . -name "*.exe"
          ZROK_EXE=$(find . -name "zrok*.exe" -type f | head -1)
          if [ -z "$ZROK_EXE" ]; then
            echo "Error: No zrok executable found!"
            exit 1
          fi
          echo "Found executable: $ZROK_EXE"
          echo "ZROK_EXE=$(realpath "$ZROK_EXE")" >> $GITHUB_ENV
          "$ZROK_EXE" version

      - name: Enable Zrok Account
        shell: bash
        env:
          ZROK_ENABLE_TOKEN: ${{ secrets.ZROK_ENABLE_TOKEN }}
        run: |
          "$ZROK_EXE" enable "$ZROK_ENABLE_TOKEN"

      - name: Create Zrok TCP Tunnel (Private)
        shell: bash
        run: |
          echo "Starting private TCP tunnel..."
          "$ZROK_EXE" share private --backend-mode tcpTunnel 127.0.0.1:3389 > tunnel.log 2>&1 &
          ZROK_PID=$!
          sleep 10

          echo "=== Tunnel Log Output ==="
          cat tunnel.log
          echo "=== End of Log ==="

          if kill -0 $ZROK_PID 2>/dev/null; then
            echo "Zrok process is running (PID: $ZROK_PID)"
          else
            echo "Zrok process exited prematurely."
            exit 1
          fi

          share_token=$(grep -oP 'zrok2 access private \K\S+' tunnel.log | head -1) || true
          if [ -n "$share_token" ]; then
            echo "========================================="
            echo "Share Token: $share_token"
            echo ""
            echo "On the client machine, run:"
            echo "  zrok access private $share_token"
            echo "This will bind RDP to a local port (e.g., 127.0.0.1:9191)"
            echo "Then connect RDP to that local address."
            echo "========================================="
          else
            echo "Note: Could not extract share token automatically. Check log above."
          fi

          while true; do
            echo "[$(date)] RDP Active via Zrok (private share)"
            sleep 300
          done
